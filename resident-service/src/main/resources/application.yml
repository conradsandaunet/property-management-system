server:
  port: 8081

spring:
  application:
    name: resident-service

  datasource:
    url: jdbc:postgresql://localhost:5432/resident
    username: resident
    password: resident

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  seed:
    board-password: ${BOARD_SEED_PASSWORD}
