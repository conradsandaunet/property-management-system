server:
  port: 8081

spring:
  application:
    name: resident-service
  servlet:
    multipart:
      # Apartment photos (the service also checks the size and the file type itself).
      max-file-size: 5MB
      max-request-size: 6MB
  config:
    # Shared and per-service settings live in Consul KV (config/application and config/<name>).
    # optional: the service still starts, on its local defaults, when Consul is unreachable.
    import: "optional:consul:"

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        # One YAML document per key: config/application/data (shared) and config/<name>/data.
        format: YAML
      discovery:
        prefer-ip-address: true
        instance-id: ${spring.application.name}-${random.value}
        # Don't crash if Consul is down (e.g. running one service from the IDE).
        fail-fast: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: resident-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  jwt:
    secret: ${JWT_SECRET}
  seed:
    board-password: ${BOARD_SEED_PASSWORD}
    resident-password: ${RESIDENT_SEED_PASSWORD:demo-resident-pw}

management:
  endpoints:
    web:
      exposure:
        include: health