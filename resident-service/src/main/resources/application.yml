server:
  port: 8081

spring:
  application:
    name: resident-service

  datasource:
    url: jdbc:postgresql://localhost:5432/resident
    username: resident
    password: resident

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
