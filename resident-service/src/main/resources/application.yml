server:
  port: 8081

spring:
  application:
    name: resident-service

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        prefer-ip-address: true
        instance-id: ${spring.application.name}-${random.value}
        # Don't crash if Consul is down (e.g. running one service from the IDE).
        fail-fast: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: resident-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  seed:
    board-password: ${BOARD_SEED_PASSWORD}
    # Demo apartments/residents and the other services' demo data (set SEED_DEMO_DATA=false to skip).
    demo-data: ${SEED_DEMO_DATA:true}
    resident-password: ${RESIDENT_SEED_PASSWORD:demo-resident-pw}
  kafka:
    topics:
      maintenance-completed: maintenance.completed

management:
  endpoints:
    web:
      exposure:
        include: health