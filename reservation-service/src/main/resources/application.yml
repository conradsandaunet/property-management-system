server:
  port: 8084

spring:
  application:
    name: reservation-service

  datasource:
    url: jdbc:postgresql://localhost:5435/reservation
    username: reservation
    password: reservation

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
