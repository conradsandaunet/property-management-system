server:
  port: 8082

spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:postgresql://localhost:5433/billing
    username: billing
    password: billing

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}

resident-service:
  base-url: http://localhost:8081