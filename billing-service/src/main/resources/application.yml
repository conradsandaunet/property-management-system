server:
  port: 8082

spring:
  application:
    name: billing-service

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        prefer-ip-address: true
        instance-id: ${spring.application.name}-${random.value}
        # Don't crash if Consul is down (e.g. running one service from the IDE).
        fail-fast: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
  seed:
    # Demo data on first start (set SEED_DEMO_DATA=false to skip).
    demo-data: ${SEED_DEMO_DATA:true}

resident-service:
  base-url: ${RESIDENT_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
