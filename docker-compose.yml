x-service: &service
  restart: unless-stopped

x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET}

services:
  resident-db:
    image: postgres:16-alpine
    container_name: resident-db
    environment:
      POSTGRES_DB: resident
      POSTGRES_USER: resident
      POSTGRES_PASSWORD: resident
    ports:
      - "5432:5432"
    volumes:
      - resident-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resident -d resident"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:16-alpine
    container_name: billing-db
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5433:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 5

  maintenance-db:
    image: postgres:16-alpine
    container_name: maintenance-db
    environment:
      POSTGRES_DB: maintenance
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
    ports:
      - "5434:5432"
    volumes:
      - maintenance-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5

  reservation-db:
    image: postgres:16-alpine
    container_name: reservation-db
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5435:5432"
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 5s
      retries: 5

  resident-service:
    <<: *service
    build:
      context: .
      args:
        MODULE: resident-service
    environment:
      <<: *jwt
      DB_URL: jdbc:postgresql://resident-db:5432/resident
      DB_USER: resident
      DB_PASSWORD: resident
      BOARD_SEED_PASSWORD: ${BOARD_SEED_PASSWORD}
    depends_on:
      resident-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  billing-service:
    <<: *service
    build:
      context: .
      args:
        MODULE: billing-service
    environment:
      <<: *jwt
      DB_URL: jdbc:postgresql://billing-db:5432/billing
      DB_USER: billing
      DB_PASSWORD: billing
      RESIDENT_SERVICE_URL: http://resident-service:8081
    depends_on:
      billing-db:
        condition: service_healthy
      resident-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  maintenance-service:
    <<: *service
    build:
      context: .
      args:
        MODULE: maintenance-service
    environment:
      <<: *jwt
      DB_URL: jdbc:postgresql://maintenance-db:5432/maintenance
      DB_USER: maintenance
      DB_PASSWORD: maintenance
    depends_on:
      maintenance-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reservation-service:
    <<: *service
    build:
      context: .
      args:
        MODULE: reservation-service
    environment:
      <<: *jwt
      DB_URL: jdbc:postgresql://reservation-db:5432/reservation
      DB_USER: reservation
      DB_PASSWORD: reservation
    depends_on:
      reservation-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Only the frontend (nginx) is published. The gateway and the services are
  # reachable inside the compose network only, so nothing can bypass the JWT check.
  gateway:
    <<: *service
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      <<: *jwt
      RESIDENT_URL: http://resident-service:8081
      BILLING_URL: http://billing-service:8082
      MAINTENANCE_URL: http://maintenance-service:8083
      RESERVATION_URL: http://reservation-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*}
    depends_on:
      resident-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      maintenance-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      gateway:
        condition: service_healthy

  # Prints the app URL once everything is healthy, so it is the last line in the
  # `docker compose up` output. Exits right away; nothing is left running.
  app-url:
    image: alpine:3.20
    restart: "no"
    command: ["echo", "Ready: open http://localhost:${FRONTEND_PORT:-3000}"]
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  resident-db-data:
  billing-db-data:
  maintenance-db-data:
  reservation-db-data: