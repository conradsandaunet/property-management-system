x-service: &service
  restart: unless-stopped

x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET}

x-consul: &consul
  CONSUL_HOST: consul

services:
  resident-db:
    image: postgres:16-alpine
    container_name: resident-db
    environment:
      POSTGRES_DB: resident
      POSTGRES_USER: resident
      POSTGRES_PASSWORD: resident
    ports:
      - "5432:5432"
    volumes:
      - resident-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resident -d resident"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:16-alpine
    container_name: billing-db
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5433:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 5

  maintenance-db:
    image: postgres:16-alpine
    container_name: maintenance-db
    environment:
      POSTGRES_DB: maintenance
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
    ports:
      - "5434:5432"
    volumes:
      - maintenance-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5

  reservation-db:
    image: postgres:16-alpine
    container_name: reservation-db
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5435:5432"
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9094:9094"      # bare for IDE-kjøring
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Service discovery, health overview and (later) central configuration.
  # Dev mode keeps everything in memory, which is fine here. UI: http://localhost:8500
  consul:
    <<: *service
    image: hashicorp/consul:2.0.0
    container_name: consul
    command: agent -dev -node=consul -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD-SHELL", "consul members > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Loads the files in ./consul-config into Consul KV (config/<name>/data) and exits. Consul runs
  # in dev mode (in memory), so this has to run on every start; the services wait for it.
  consul-config:
    image: hashicorp/consul:2.0.0
    container_name: consul-config
    restart: "no"
    depends_on:
      consul:
        condition: service_healthy
    volumes:
      - ./consul-config:/config:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /config/*.yml; do
          name=$$(basename "$$f" .yml)
          consul kv put -http-addr=http://consul:8500 "config/$$name/data" @"$$f" > /dev/null
          echo "Loaded config/$$name/data"
        done

  resident-service:
    <<: *service
    build:
      context: .
      args:
        MODULE: resident-service
    environment:
      <<: [*jwt, *consul]
      DB_URL: jdbc:postgresql://resident-db:5432/resident
      DB_USER: resident
      DB_PASSWORD: resident
      BOARD_SEED_PASSWORD: ${BOARD_SEED_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      consul:
        condition: service_healthy
      consul-config:
        condition: service_completed_successfully
      resident-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  billing-service:
    <<: *service
    build:
      context: .
      args:
        MODULE: billing-service
    environment:
      <<: [*jwt, *consul]
      DB_URL: jdbc:postgresql://billing-db:5432/billing
      DB_USER: billing
      DB_PASSWORD: billing
      RESIDENT_SERVICE_URL: http://resident-service:8081
    depends_on:
      consul:
        condition: service_healthy
      consul-config:
        condition: service_completed_successfully
      billing-db:
        condition: service_healthy
      resident-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  maintenance-service:
    <<: *service
    build:
      context: .
      args:
        MODULE: maintenance-service
    environment:
      <<: [*jwt, *consul]
      DB_URL: jdbc:postgresql://maintenance-db:5432/maintenance
      DB_USER: maintenance
      DB_PASSWORD: maintenance
      WORKER_SEED_PASSWORD: ${WORKER_SEED_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      consul:
        condition: service_healthy
      consul-config:
        condition: service_completed_successfully
      maintenance-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reservation-service:
    <<: *service
    build:
      context: .
      args:
        MODULE: reservation-service
    environment:
      <<: [*jwt, *consul]
      DB_URL: jdbc:postgresql://reservation-db:5432/reservation
      DB_USER: reservation
      DB_PASSWORD: reservation
    depends_on:
      consul:
        condition: service_healthy
      consul-config:
        condition: service_completed_successfully
      reservation-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Only the frontend (nginx) is published. The gateway and the services are
  # reachable inside the compose network only, so nothing can bypass the JWT check.
  gateway:
    <<: *service
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      <<: [*jwt, *consul]
    depends_on:
      consul:
        condition: service_healthy
      consul-config:
        condition: service_completed_successfully
      resident-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      maintenance-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  resident-db-data:
  billing-db-data:
  maintenance-db-data:
  reservation-db-data: