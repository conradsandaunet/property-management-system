name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      resident-db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: resident, POSTGRES_USER: resident, POSTGRES_PASSWORD: resident }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resident -d resident" --health-interval 5s
          --health-timeout 5s --health-retries 10
      billing-db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: billing, POSTGRES_USER: billing, POSTGRES_PASSWORD: billing }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U billing -d billing" --health-interval 5s
          --health-timeout 5s --health-retries 10
      maintenance-db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: maintenance, POSTGRES_USER: maintenance, POSTGRES_PASSWORD: maintenance }
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance" --health-interval 5s
          --health-timeout 5s --health-retries 10
      reservation-db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: reservation, POSTGRES_USER: reservation, POSTGRES_PASSWORD: reservation }
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U reservation -d reservation" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run backend tests
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
