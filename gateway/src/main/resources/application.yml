server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: resident
              uri: ${RESIDENT_URL}
              predicates:
                - Path=/api/auth/**,/api/residents/**,/api/apartments/**
              filters:
                - StripPrefix=1
            - id: billing
              uri: ${BILLING_URL}
              predicates:
                - Path=/api/invoices/**
              filters:
                - StripPrefix=1
            - id: maintenance
              uri: ${MAINTENANCE_URL}
              predicates:
                - Path=/api/maintenance/**,/api/workers/**
              filters:
                - StripPrefix=1
            - id: reservation
              uri: ${RESERVATION_URL}
              predicates:
                - Path=/api/reservations/**,/api/resources/**
              filters:
                - StripPrefix=1

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health
