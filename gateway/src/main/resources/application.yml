server:
  port: 8080
  forward-headers-strategy: native

spring:
  application:
    name: gateway
  config:
    # Shared and per-service settings live in Consul KV (config/application and config/<name>).
    # optional: the service still starts, on its local defaults, when Consul is unreachable.
    import: "optional:consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        # One YAML document per key: config/application/data (shared) and config/<name>/data.
        format: YAML
      discovery:
        prefer-ip-address: true
        instance-id: ${spring.application.name}-${random.value}
        # Don't crash if Consul is down (e.g. running one service from the IDE).
        fail-fast: false
        # Only route to instances whose Consul health check is passing.
        query-passing: true
    loadbalancer:
      cache:
        # Default is 35s, which keeps sending traffic to a dead instance for that long.
        ttl: 5s
    gateway:
      server:
        webmvc:
          routes:
            - id: resident
              uri: lb://resident-service
              predicates:
                - Path=/api/auth/**,/api/residents/**,/api/apartments/**,/api/buildings/**,/api/notifications/**
              filters:
                - StripPrefix=1
            - id: billing
              uri: lb://billing-service
              predicates:
                - Path=/api/invoices/**
              filters:
                - StripPrefix=1
            - id: maintenance
              uri: lb://maintenance-service
              predicates:
                - Path=/api/maintenance/**,/api/workers/**
              filters:
                - StripPrefix=1
            - id: reservation
              uri: lb://reservation-service
              predicates:
                - Path=/api/reservations/**,/api/resources/**
              filters:
                - StripPrefix=1


app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health
