server:
  port: 8083

spring:
  application:
    name: maintenance-service

  datasource:
    url: jdbc:postgresql://localhost:5434/maintenance
    username: maintenance
    password: maintenance

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

