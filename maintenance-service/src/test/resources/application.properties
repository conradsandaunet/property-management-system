# Test defaults: the context tests need the local Postgres from docker-compose.
spring.datasource.url=jdbc:postgresql://localhost:5434/maintenance
spring.datasource.username=maintenance
spring.datasource.password=maintenance
app.jwt.secret=test-secret-test-secret-test-secret-123456
app.seed.worker-password=change-this-password
spring.kafka.listener.auto-startup=false
spring.cloud.consul.enabled=false
app.seed.demo-data=false
spring.cloud.consul.config.enabled=false
# The tests have no Kafka broker, so don't try to create the topic.
spring.kafka.admin.auto-create=false
